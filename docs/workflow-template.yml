# Lupa: Fluxo A (unprivileged). Copy into .github/workflows/ of the consuming repository.
# Replace OWNER and the action SHA below with a released commit of lupa.
#
# Trust model (read before enabling):
# - issue_comment and pull_request_review run in the BASE repository context WITH secrets. Those
#   triggers are gated to trusted author associations (OWNER, MEMBER, COLLABORATOR) by the action.
# - Scanners (semgrep, gitleaks, trivy, osv-scanner) are trusted binaries. They READ PR-controlled
#   files as data and do not execute repository code.
# - Only L2 native toolchains execute repository-defined tooling (linters, build tooling). On FORK
#   PRs with secrets in scope (any non-pull_request trigger, a writable App token, or an LLM key),
#   the action does NOT run L2. That is the fork gate.
# - Every scanner and L2 process gets a scrubbed environment (no *TOKEN*, *KEY*, *SECRET*,
#   *PASSWORD*, *AUTH*, GITHUB_TOKEN, ACTIONS_*). This is NOT a sandbox: a residual
#   /proc-vector remains (a process can read its own parent's environment and memory maps).
#   Known limitation. For high-threat repositories, separate the review of untrusted code into a
#   workflow with no secrets and no base-repository context, and post results through the
#   privileged workflow (docs/workflow-template-privileged.yml) only.
name: Lupa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: false

permissions:
  contents: read
  pull-requests: write
  # Uncomment ONLY when PR_REVIEWER_ISSUE_FALLBACK is "true" (issue-comment fallback for refused reviews):
  # issues: write
  # Uncomment ONLY together with the SARIF upload step below (code scanning, same-repo PRs):
  # security-events: write

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Association gate at job level (M11): re-trigger comments and reviews need a trusted author.
    # The action repeats the check, so a missed gate here still never runs a review.
    if: >-
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
      && (github.event_name != 'pull_request_review' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
    steps:
      - name: Checkout (full history, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base and head SHAs from the API
        id: shas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "base_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.sha)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR head and base, check out the PR head
        env:
          FETCH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
          HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Token auth for explicit fetches (private repos): an in-memory extraheader passed through
          # GIT_CONFIG_* env, so the token never reaches argv, .git/config, or the logs.
          # Without a token the fetch is anonymous (public repositories only).
          git_auth() {
            if [ -n "${FETCH_TOKEN:-}" ]; then
              basic=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0=http.extraheader
              export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
            else
              unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            fi
          }
          git_auth
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pr-reviewer/head-${PR_NUMBER}"
          git fetch --no-tags origin "${BASE_SHA}"
          git checkout --detach --force "${HEAD_SHA}"

      - name: Install semgrep (pinned, from PyPI; no docker needed)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --disable-pip-version-check semgrep==1.180.0
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Write diff (base...head, never the runner HEAD)
        env:
          OUT_DIR: ${{ runner.temp }}/pr-reviewer-out
          BASE_SHA: ${{ steps.shas.outputs.base_sha }}
          HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # Same effect as `git -c core.quotePath=false`: raw UTF-8 names, no octal-quoted paths.
          export GIT_CONFIG_PARAMETERS="'core.quotePath=false'"
          git diff -U3 --no-ext-diff --no-color "${BASE_SHA}...${HEAD_SHA}" > "$OUT_DIR/diff.patch"

      - name: Review
        id: review
        # Exit 2 (warning) must never block the merge; the gate step below decides.
        continue-on-error: true
        uses: OWNER/lupa@0000000000000000000000000000000000000000 # replace with a released SHA
        env:
          PR_REVIEWER_BASE_SHA: ${{ steps.shas.outputs.base_sha }}
          PR_REVIEWER_HEAD_SHA: ${{ steps.shas.outputs.head_sha }}
          PR_REVIEWER_ARTIFACT_DIR: ${{ runner.temp }}/pr-reviewer-out
          PR_REVIEWER_TOKEN_TYPE: github-token
          PR_REVIEWER_ISSUE_FALLBACK: "false"
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          llm_provider: openai
          llm_model: ${{ vars.PR_REVIEWER_MODEL }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          fail_level: warning

      # This step is evaluated on every event. Its guard checks only that the event has a same-repository
      # PR head. Without security-events: write (commented out above), the upload fails and
      # continue-on-error absorbs it, so the job still passes. The guard is false on
      # issue_comment and workflow_dispatch (no PR head context), where the step is skipped.
      - name: "Upload SARIF (same-repo PRs; needs security-events: write above)"
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/pr-reviewer-out/sarif.json

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-reviewer-out
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr-reviewer-out/diff.patch
            ${{ runner.temp }}/pr-reviewer-out/pr-meta.json
            ${{ runner.temp }}/pr-reviewer-out/findings.json
            ${{ runner.temp }}/pr-reviewer-out/sarif.json
            ${{ runner.temp }}/pr-reviewer-out/sbom.cdx.json

      - name: Enforce fail_level (warning check never blocks)
        if: always()
        env:
          EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        run: |
          case "$EXIT_CODE" in
            0|2) exit 0 ;;
            *) echo "pr-reviewer: gate failed (exit code: ${EXIT_CODE:-none})" >&2; exit 1 ;;
          esac
