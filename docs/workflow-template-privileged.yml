# PR Reviewer: Fluxo B (privileged). Posts the review produced by the PR run.
# Runs in the base repository context. It only downloads the artifact and posts it:
# no checkout, no scanners, no LLM. Replace OWNER and the action SHA below.
name: PR Reviewer (post)

on:
  workflow_run:
    workflows: ["PR Reviewer"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-reviewer-priv-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  post:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token (optional; App tokens may write on fork PRs)
        id: app
        if: vars.PR_REVIEWER_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_REVIEWER_APP_ID }}
          private-key: ${{ secrets.PR_REVIEWER_APP_KEY }}

      - name: Download the PR run's review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-reviewer-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-reviewer-priv-out

      - name: Verify artifact files exist (fail before posting)
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pr-reviewer-priv-out
        run: |
          set -euo pipefail
          for f in diff.patch pr-meta.json findings.json; do
            test -s "$ARTIFACT_DIR/$f" || { echo "pr-reviewer: missing $f in artifact" >&2; exit 1; }
          done

      - name: Post review
        # Reporting only: it does not gate merges (the PR run's gate does).
        continue-on-error: true
        uses: OWNER/pr-reviewer@0000000000000000000000000000000000000000 # replace with a released SHA
        env:
          PR_REVIEWER_ARTIFACT_DIR: ${{ runner.temp }}/pr-reviewer-priv-out
          PR_REVIEWER_TOKEN_TYPE: ${{ steps.app.outcome == 'success' && 'app' || 'github-token' }}
          PR_REVIEWER_ISSUE_FALLBACK: "false"
        with:
          github_token: ${{ steps.app.outputs.token || github.token }}
          post_comment: "true"
